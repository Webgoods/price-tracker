name: Rileva prezzi

# Solo avvio manuale: Amazon e MediaWorld bloccano i server di GitHub,
# quindi la rilevazione giornaliera parte dai PC (scripts/run-local.sh).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rileva prezzi
        run: python tracker.py

      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Prezzi del $(date -u +%F)"
          git push
